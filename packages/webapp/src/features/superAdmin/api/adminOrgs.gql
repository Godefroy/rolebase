query AdminOrgs(
  $limit: Int!
  $offset: Int!
  $search: String!
  $active: Boolean!
) {
  org(
    limit: $limit
    offset: $offset
    where: { name: { _ilike: $search }, archivedAt: { _is_null: $active } }
    order_by: { createdAt: desc }
  ) {
    id
    name
    slug
    createdAt
    archivedAt
    org_subscription {
      id
      status
      type
    }
    members_aggregate {
      aggregate {
        count
      }
    }
  }
  org_aggregate(
    where: { name: { _ilike: $search }, archivedAt: { _is_null: $active } }
  ) {
    aggregate {
      count
    }
  }
}
