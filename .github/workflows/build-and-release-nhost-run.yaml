# Copy of https://github.com/nhost-actions/workflows/blob/main/.github/workflows/build-and-release-nhost-run.yaml
# with Dockerfile path and one native runner per platform

---
name: 'Release Workflow'
on:
  workflow_call:
    inputs:
      IMAGE:
        description: Image to build and push
        type: string
        required: true
      SERVICE_ID:
        description: Service ID to deploy to
        type: string
        required: true
      DOCKER_CONTEXT:
        description: Path to folder where to build the docker image
        type: string
        required: false
        default: .
      DOCKER_FILE:
        description: Path to Dockerfile
        type: string
        required: false
        default: ./Dockerfile
      NHOST_SERVICE_CONFIG:
        description: Path to Nhost service configuration file
        type: string
        required: false
        default: ./nhost-service.toml
    secrets:
      PAT:
        description: Nhost PAT. See https://github.com/nhost-actions/authenticate#creating-a-pat
        required: true

jobs:
  # One native runner per platform (QEMU emulation of arm64 is ~10x slower)
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v4

      - name: Install Nhost CLI
        uses: nhost-actions/install-nhost-cli@v1

      - name: Authenticate with Nhost
        uses: nhost-actions/authenticate@v1
        with:
          pat: ${{ secrets.PAT }}

      - name: Configure docker credentials
        uses: nhost-actions/configure-container-registry@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare
        run: |
          PLATFORM='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # Each platform image is pushed with its own tag (IMAGE-linux-amd64...)
      # rather than by digest: the Nhost registry intermittently answers 403
      # or "service not found" on untagged manifests
      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          file: ${{ inputs.DOCKER_FILE }}
          platforms: ${{ matrix.platform }}
          tags: ${{ inputs.IMAGE }}-${{ env.PLATFORM_PAIR }}
          push: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Retry once after a transient registry error, layers come from the cache
      - name: Wait before retry
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build and push (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          file: ${{ inputs.DOCKER_FILE }}
          platforms: ${{ matrix.platform }}
          tags: ${{ inputs.IMAGE }}-${{ env.PLATFORM_PAIR }}
          push: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v4

      - name: Install Nhost CLI
        uses: nhost-actions/install-nhost-cli@v1

      - name: Authenticate with Nhost
        uses: nhost-actions/authenticate@v1
        with:
          pat: ${{ secrets.PAT }}

      - name: Configure docker credentials
        uses: nhost-actions/configure-container-registry@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest
        run: |
          IMAGE='${{ inputs.IMAGE }}'
          for attempt in 1 2 3; do
            docker buildx imagetools create -t "$IMAGE" "$IMAGE-linux-amd64" "$IMAGE-linux-arm64" && break
            [ "$attempt" = 3 ] && exit 1
            echo "Registry error, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          docker buildx imagetools inspect "$IMAGE"

      - name: Deploy service configuration
        uses: nhost-actions/nhost-run-config-deploy@v1
        with:
          configuration_file: ${{ inputs.NHOST_SERVICE_CONFIG }}
          service_id: ${{ inputs.SERVICE_ID }}
          image: ${{ inputs.IMAGE }}
