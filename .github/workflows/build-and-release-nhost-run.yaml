# Copy of https://github.com/nhost-actions/workflows/blob/main/.github/workflows/build-and-release-nhost-run.yaml
# with Dockerfile path and one native runner per platform

---
name: 'Release Workflow'
on:
  workflow_call:
    inputs:
      IMAGE:
        description: Image to build and push
        type: string
        required: true
      SERVICE_ID:
        description: Service ID to deploy to
        type: string
        required: true
      DOCKER_CONTEXT:
        description: Path to folder where to build the docker image
        type: string
        required: false
        default: .
      DOCKER_FILE:
        description: Path to Dockerfile
        type: string
        required: false
        default: ./Dockerfile
      NHOST_SERVICE_CONFIG:
        description: Path to Nhost service configuration file
        type: string
        required: false
        default: ./nhost-service.toml
    secrets:
      PAT:
        description: Nhost PAT. See https://github.com/nhost-actions/authenticate#creating-a-pat
        required: true

jobs:
  # One native runner per platform (QEMU emulation of arm64 is ~10x slower)
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v4

      - name: Install Nhost CLI
        uses: nhost-actions/install-nhost-cli@v1

      - name: Authenticate with Nhost
        uses: nhost-actions/authenticate@v1
        with:
          pat: ${{ secrets.PAT }}

      - name: Configure docker credentials
        uses: nhost-actions/configure-container-registry@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare
        run: |
          IMAGE='${{ inputs.IMAGE }}'
          echo "IMAGE_NAME=${IMAGE%:*}" >> "$GITHUB_ENV"
          PLATFORM='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          file: ${{ inputs.DOCKER_FILE }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v4

      - name: Install Nhost CLI
        uses: nhost-actions/install-nhost-cli@v1

      - name: Authenticate with Nhost
        uses: nhost-actions/authenticate@v1
        with:
          pat: ${{ secrets.PAT }}

      - name: Configure docker credentials
        uses: nhost-actions/configure-container-registry@v1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE='${{ inputs.IMAGE }}'
          docker buildx imagetools create -t "$IMAGE" $(printf "${IMAGE%:*}@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE"

      - name: Deploy service configuration
        uses: nhost-actions/nhost-run-config-deploy@v1
        with:
          configuration_file: ${{ inputs.NHOST_SERVICE_CONFIG }}
          service_id: ${{ inputs.SERVICE_ID }}
          image: ${{ inputs.IMAGE }}
