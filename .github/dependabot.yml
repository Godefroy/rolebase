version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /packages/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
