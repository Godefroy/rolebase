table:
  name: meeting_step
  schema: public
object_relationships:
  - name: meeting
    using:
      foreign_key_constraint_on: meetingId
insert_permissions:
  - role: user
    permission:
      check:
        meeting:
          _or:
            - circle:
                participants:
                  member:
                    userId:
                      _eq: X-Hasura-User-Id
            - _and:
                - invitedReadonly:
                    _eq: false
                - meeting_attendees:
                    member:
                      userId:
                        _eq: X-Hasura-User-Id
      columns:
        - data
        - meetingId
        - notes
        - stepConfigId
        - type
select_permissions:
  - role: user
    permission:
      columns:
        - data
        - id
        - meetingId
        - notes
        - stepConfigId
        - type
      filter:
        meeting:
          _or:
            - circle:
                participants:
                  member:
                    userId:
                      _eq: X-Hasura-User-Id
            - meeting_attendees:
                member:
                  userId:
                    _eq: X-Hasura-User-Id
            - _and:
                - private:
                    _eq: false
                - org:
                    members:
                      userId:
                        _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - data
        - notes
      filter:
        meeting:
          _or:
            - circle:
                participants:
                  member:
                    userId:
                      _eq: X-Hasura-User-Id
            - _and:
                - invitedReadonly:
                    _eq: false
                - meeting_attendees:
                    member:
                      userId:
                        _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        meeting:
          _or:
            - circle:
                participants:
                  member:
                    userId:
                      _eq: X-Hasura-User-Id
            - _and:
                - invitedReadonly:
                    _eq: false
                - meeting_attendees:
                    member:
                      userId:
                        _eq: X-Hasura-User-Id
event_triggers:
  - name: index-meeting-step
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{BACKEND_URL}}/trigger'
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: true
      clear_older_than: 168
      paused: false
      schedule: 0 0 * * *
      timeout: 60
