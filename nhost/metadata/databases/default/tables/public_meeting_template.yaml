table:
  name: meeting_template
  schema: public
object_relationships:
  - name: circle
    using:
      foreign_key_constraint_on: circleId
  - name: org
    using:
      foreign_key_constraint_on: orgId
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - org:
              archivedAt:
                _is_null: true
              members:
                _and:
                  - userId:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - role:
                          _eq: Member
                      - role:
                          _eq: Admin
                      - role:
                          _eq: Owner
          - _or:
              - circleId:
                  _is_null: true
              - circle:
                  orgId:
                    _ceq:
                      - $
                      - orgId
      columns:
        - circleId
        - orgId
        - stepsConfig
        - title
select_permissions:
  - role: user
    permission:
      columns:
        - archivedAt
        - circleId
        - createdAt
        - stepsConfig
        - title
        - id
        - orgId
      filter:
        org:
          members:
            userId:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - archivedAt
        - circleId
        - stepsConfig
        - title
      filter:
        org:
          members:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - _or:
                  - role:
                      _eq: Member
                  - role:
                      _eq: Admin
                  - role:
                      _eq: Owner
      check:
        _and:
          - org:
              archivedAt:
                _is_null: true
          - _or:
              - circleId:
                  _is_null: true
              - circle:
                  orgId:
                    _ceq:
                      - $
                      - orgId
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - _or:
                  - role:
                      _eq: Member
                  - role:
                      _eq: Admin
                  - role:
                      _eq: Owner
