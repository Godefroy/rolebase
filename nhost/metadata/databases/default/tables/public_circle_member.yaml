table:
  name: circle_member
  schema: public
object_relationships:
  - name: circle
    using:
      foreign_key_constraint_on: circleId
  - name: member
    using:
      foreign_key_constraint_on: memberId
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _not:
              _exists:
                _table:
                  name: circle_member
                  schema: public
                _where:
                  _and:
                    - id:
                        _cne: id
                    - circleId:
                        _ceq: circleId
                    - memberId:
                        _ceq: memberId
                    - archivedAt:
                        _is_null: true
          - circle:
              orgId:
                _ceq:
                  - $
                  - orgId
          - member:
              orgId:
                _ceq:
                  - $
                  - orgId
          - circle:
              _or:
                - org:
                    members:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: Owner
                - org:
                    _and:
                      - governanceMode:
                          _eq: Free
                      - members:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - _or:
                                - role:
                                    _eq: Admin
                                - role:
                                    _eq: Member
                - _and:
                    - role:
                        parentLink:
                          _eq: false
                    - _or:
                        - parent:
                            leaders:
                              member:
                                _and:
                                  - userId:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in:
                                        - Member
                                        - Admin
                                        - Owner
                        - children:
                            _and:
                              - role:
                                  parentLink:
                                    _eq: true
                              - archivedAt:
                                  _is_null: true
                              - members:
                                  _and:
                                    - member:
                                        _and:
                                          - userId:
                                              _eq: X-Hasura-User-Id
                                          - role:
                                              _in:
                                                - Member
                                                - Admin
                                                - Owner
                                    - archivedAt:
                                        _is_null: true
                - _and:
                    - role:
                        parentLink:
                          _eq: true
                    - parent:
                        parent:
                          leaders:
                            member:
                              _and:
                                - userId:
                                    _eq: X-Hasura-User-Id
                                - role:
                                    _in:
                                      - Member
                                      - Admin
                                      - Owner
      columns:
        - circleId
        - id
        - memberId
        - orgId
select_permissions:
  - role: user
    permission:
      columns:
        - archivedAt
        - circleId
        - createdAt
        - id
        - memberId
        - orgId
      filter:
        circle:
          org:
            archivedAt:
              _is_null: true
            members:
              userId:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - archivedAt
      filter:
        circle:
          _or:
            - org:
                members:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: Owner
            - org:
                _and:
                  - governanceMode:
                      _eq: Free
                  - members:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - _or:
                            - role:
                                _eq: Admin
                            - role:
                                _eq: Member
            - _and:
                - role:
                    parentLink:
                      _eq: false
                - _or:
                    - parent:
                        leaders:
                          member:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - role:
                                  _in:
                                    - Member
                                    - Admin
                                    - Owner
                    - children:
                        _and:
                          - role:
                              parentLink:
                                _eq: true
                          - archivedAt:
                              _is_null: true
                          - members:
                              _and:
                                - member:
                                    _and:
                                      - userId:
                                          _eq: X-Hasura-User-Id
                                      - role:
                                          _in:
                                            - Member
                                            - Admin
                                            - Owner
                                - archivedAt:
                                    _is_null: true
            - _and:
                - role:
                    parentLink:
                      _eq: true
                - parent:
                    parent:
                      leaders:
                        member:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - role:
                                _in:
                                  - Member
                                  - Admin
                                  - Owner
      check: {}
event_triggers:
  - name: index-circle-member
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{BACKEND_URL}}/trigger'
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: true
      clear_older_than: 168
      paused: false
      schedule: 0 0 * * *
      timeout: 60
